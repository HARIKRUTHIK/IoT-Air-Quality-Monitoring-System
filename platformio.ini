; ==============================================================================
; PlatformIO Project Configuration for IoT-Air-Quality-Monitoring-System
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    blynkkk/Blynk @ ^1.3.2

build_flags =
    -D CORE_DEBUG_LEVEL=2
